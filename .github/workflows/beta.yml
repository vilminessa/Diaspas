# Полоса dev: бета-пререлиз по тегу b* (версия берётся из тега).
# Тег обязан входить в dev, публикация как GitHub Pre-release.
# Стабильная полоса (v*, релиз из main) живёт отдельно -
# .github/workflows/release.yml.
# Пробный запуск: workflow_dispatch (ветка вручную) - пройдут verify и
# build, публикация и провенанс выполняются только на тегах.

name: beta

on:
  push:
    tags: ["b*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: проверки перед сборкой
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # полная история нужна гардам «тег в main/dev»: merge-base
          # --is-ancestor на shallow-клоне не видит общей истории тега и ветки
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Актуальность бандла UI (ui_src -> bundle.py)
        run: python tools/build_ui.py --check
      - name: Юнит-тесты (pytest)
        run: python -m pytest tests/ -q
      - name: Линт (pyflakes)
        run: python -m pyflakes core ui tools i18n.py main.py
      - name: Формат тега (b1.0.0)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^b[0-9]+(\.[0-9]+){2,3}$ ]]; then
            echo "tag $GITHUB_REF_NAME ok"
          else
            echo "::error::tag $GITHUB_REF_NAME has wrong format; expected b1.0.0"
            exit 1
          fi
      - name: Тег b указывает на коммит из dev
        # бета собирается из dev: тег на коммите, которого ещё нет в dev,
        # падает здесь - до сборки exe и публикации не доходит; if нужен
        # для dispatch (ветка, тега нет)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "tag $GITHUB_REF_NAME is reachable from origin/dev - ok"
          else
            echo "::error::tag $GITHUB_REF_NAME is not in dev; push the commit to dev first, then move the tag."
            exit 1
          fi

  build:
    name: сборка Diaspas.exe
    needs: verify
    runs-on: windows-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Сборка exe
        run: python -m PyInstaller diaspas.spec --distpath . --workpath build --noconfirm
      - name: Проверка артефакта
        shell: bash
        # нижняя граница - защита от пустой/обрезанной сборки: локально
        # Diaspas.exe весит ~12.5 МБ
        run: python -c "import os; s = os.path.getsize('Diaspas.exe'); print('Diaspas.exe', s, 'bytes'); assert s > 8_000_000, s"
      - name: Хеш артефакта (формат sha256sum, base64 - для SLSA)
        id: hash
        shell: bash
        run: |
          python -c "import hashlib, base64; h = hashlib.sha256(); f = open('Diaspas.exe', 'rb'); [h.update(c) for c in iter(lambda: f.read(1048576), b'')]; open('digests.b64', 'w').write(base64.b64encode((h.hexdigest() + '  Diaspas.exe\n').encode()).decode())"
          echo "digests=$(cat digests.b64)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Diaspas-exe
          path: Diaspas.exe
          if-no-files-found: error
          retention-days: 5

  python-publish:
    name: публикация exe в релиз
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Diaspas-exe
      - name: Создать/обновить бета-релиз тега
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Бета-сборка из dev ($GITHUB_REF_NAME). Автоматическая сборка (CI). Провенанс SLSA прикладывается отдельным джобом."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Diaspas.exe --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" Diaspas.exe --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes" \
              --prerelease
          fi

  generator-generic-ossf-slsa3-publish:
    name: SLSA-провенанс
    needs: [build, python-publish]
    # на теге ждём успеха публикации, на dispatch публикация пропущена -
    # генерация провенанса всё равно должна пройти (проба конвейера)
    if: always() && (needs.python-publish.result == 'success' || needs.python-publish.result == 'skipped')
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      # репозиторий приватный: без флага генератор падает, чтобы не утащить
      # имя репо в публичный transparency log (rekor). Цена флага - имя
      # vilminessa/Diaspas действительно станет видно в этом логе;
      # содержимое репо остаётся закрытым
      private-repository: true
      # на теге - в релиз, на dispatch - просто артефакт рана (проба конвейера)
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

  verify-attestation:
    name: проверка подписи
    needs: generator-generic-ossf-slsa3-publish
    # интота-бандл подписывается в ассеты релиза (upload-assets) - на теге
    # сверяем его с exe; на dispatch ассетов релиза нет - пропускаем
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Скачать exe и провенанс из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            -p Diaspas.exe -p Diaspas.exe.intoto.jsonl --clobber
      - name: gh attestation verify (bundle из релиза)
        env:
          GH_TOKEN: ${{ github.token }}
        # бандл - sigstore + provenance v0.2, подписант - reusable workflow
        # генератора: без этих флагов gh ищет v1 в реестре и даёт 404
        run: |
          gh attestation verify Diaspas.exe \
            --bundle Diaspas.exe.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v0.2 \
            --signer-repo slsa-framework/slsa-github-generator
