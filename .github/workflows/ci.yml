# Ветки main и dev: проверки на push и pull_request. Сборка и публикация
# версий живут отдельно (beta.yml по тегу b*, release.yml по тегу v*) -
# здесь только gating: бандл, синтаксис, тесты, линт, линт конвейера.

name: ci

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read

# Windows-раннер печатает в cp1252; кириллица в выводе python
# (build_ui, pytest) падает UnicodeEncodeError. UTF-8 на уровне
# интерпретатора - единое решение для всех шагов.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  checks:
    name: тесты и линт
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Синтаксис Python (compileall)
        run: python -m compileall -q core ui tools tests i18n.py main.py version.py
      - name: Синтаксис JS (node --check)
        shell: bash
        run: node --check ui_src/app.js
      - name: Актуальность бандла UI (ui_src -> bundle.py)
        run: python tools/build_ui.py --check
      - name: Юнит-тесты (pytest)
        run: python -m pytest tests/ -q
      - name: Линт (pyflakes)
        run: python -m pyflakes core ui tools i18n.py main.py version.py
      - name: Линт workflows (.github/workflows)
        run: python tools/check_workflows.py
